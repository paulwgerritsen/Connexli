# Render Blueprint: provisions the Connexli web app AND its Postgres database together.
# In Render: New → Blueprint → select this repository → Apply.
services:
  - type: web
    name: connexli-app
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false   # Render will prompt you to type this in
      - key: ADMIN_PASSWORD
        sync: false   # Render will prompt you to type this in — use a long, unique password
      - key: RELD_API_KEY
        sync: false   # paste your RELD API key here (never in the code or GitHub)
      - key: RELD_API_BASE_URL
        value: https://app.realestatelicensedatabase.com
      - key: TURNSTILE_SITE_KEY
        sync: false   # Cloudflare Turnstile Site Key (public — shown in page source by design)
      - key: TURNSTILE_SECRET_KEY
        sync: false   # Cloudflare Turnstile Secret Key (server-side ONLY — never in code or GitHub)
      - key: PAYMENTS_PROVIDER
        sync: false   # leave EMPTY until a processor is chosen; then "stripe"
      - key: STRIPE_SECRET_KEY
        sync: false   # Stripe secret key (server-side ONLY — never in code or GitHub)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false   # Stripe webhook signing secret for /webhooks/stripe
      - key: DATABASE_URL
        fromDatabase:
          name: connexli-db
          property: connectionString

databases:
  - name: connexli-db
    plan: basic-256mb
